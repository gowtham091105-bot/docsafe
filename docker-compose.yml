version: '3.8'

services:
  db:
    image: postgres:15-alpine
    container_name: docsafe-postgres
    environment:
      POSTGRES_USER: docsafe_user
      POSTGRES_PASSWORD: docsafe_password
      POSTGRES_DB: docsafe_db
    ports:
      - '5432:5432'
    volumes:
      - docsafe-pgdata:/var/lib/postgresql/data
    restart: unless-stopped

volumes:
  docsafe-pgdata:
